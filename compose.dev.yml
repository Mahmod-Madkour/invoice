# Development and testing. Source is bind-mounted; nothing is baked into the image.
#   docker compose -f compose.dev.yml up --build app        # http://localhost:8000 with auto-reload
#   docker compose -f compose.dev.yml run --rm tests        # run the test suite
#   docker compose -f compose.dev.yml run --rm tests python scripts/render_samples.py

name: invoice-dev  # separate from the production project ("invoice", compose.yml)

x-dev: &dev
  build:
    context: .
    target: dev
  image: invoice-app:dev
  working_dir: /srv
  volumes:
    - .:/srv
  # Write generated files (samples/, caches) as your host user on Linux.
  # Docker Desktop (Windows/macOS) maps ownership automatically.
  user: "${UID:-1000}:${GID:-1000}"
  environment:
    HOME: /tmp

services:
  app:
    <<: *dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --no-access-log
    environment:
      HOME: /tmp
      ENABLE_API_DOCS: "true"
      LOG_LEVEL: debug
    ports:
      - "8000:8000"

  tests:
    <<: *dev
    profiles: ["tools"]
    command: pytest
