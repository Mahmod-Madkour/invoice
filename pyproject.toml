[project]
name = "invoice-app"
version = "0.1.0"
description = "Arabic RTL invoice PDF generator (FastAPI + WeasyPrint)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Dependencies are pinned to exact versions in requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:app.*",
    # Starlette 1.x nudges TestClient users towards httpx2; the spec's TestClient (httpx) works as is.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
